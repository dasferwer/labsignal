[project]
name = "labsignal"
version = "0.1.0"
description = "A/B-эксперименты с показами, CUPED и заранее заданными проверками"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "numpy>=2,<3", "scipy>=1.15,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
